[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thehive-mcp-server"
version = "1.0.0"
description = "Servidor MCP dedicado para integração com TheHive 5 (Model Context Protocol)"
authors = [
    { name = "SOC Automation Team", email = "soc-admin@local.com" }
]
dependencies = [
    "fastmcp>=0.1.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }

[project.urls]
Homepage = "https://github.com/nks1097/TheHive-MCP-Server"
Repository = "https://github.com/nks1097/TheHive-MCP-Server"
